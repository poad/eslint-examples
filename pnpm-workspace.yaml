packages:
  - non-react
  - react-based/*
  - aws-cdk
  - aws-cdk-vitest

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.15.0

overrides:
  semver: '>=7'

trustPolicy: no-downgrade
