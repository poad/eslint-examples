packages:
  - non-react
  - react-based/*
  - aws-cdk
  - aws-cdk-vitest

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.24.0
  - '@pnpm/exe.android-arm64@12.24.0'
  - '@pnpm/exe.android-x64@12.24.0'
  - '@pnpm/exe.darwin-arm64@12.24.0'
  - '@pnpm/exe.darwin-x64@12.24.0'
  - '@pnpm/exe.freebsd-x64@12.24.0'
  - '@pnpm/exe.linux-arm64-musl@12.24.0'
  - '@pnpm/exe.linux-arm64@12.24.0'
  - '@pnpm/exe.linux-loong64@12.24.0'
  - '@pnpm/exe.linux-ppc64@12.24.0'
  - '@pnpm/exe.linux-riscv64@12.24.0'
  - '@pnpm/exe.linux-s390x@12.24.0'
  - '@pnpm/exe.linux-x64-musl@12.24.0'
  - '@pnpm/exe.linux-x64@12.24.0'
  - '@pnpm/exe.netbsd-x64@12.24.0'
  - '@pnpm/exe.win32-arm64@12.24.0'
  - '@pnpm/exe.win32-x64@12.24.0'

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
